    <title>Car Rental Express — Self-Drive Car Rentals in Delhi</title>
  </head>
  <body>
    <div id="root">
      <style>
        #initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #0b1120;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          z-index: 99999;
          color: #ffffff;
        }
        .loader-logo-ring {
          position: relative;
          width: 64px;
          height: 64px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 18px;
          background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
          box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.5);
          animation: pulseRing 1.8s ease-in-out infinite;
        }
        .loader-spinner {
          position: absolute;
          inset: -6px;
          border-radius: 24px;
          border: 2px solid transparent;
          border-top-color: #fb923c;
          border-right-color: #f59e0b;
          animation: spin 1s linear infinite;
        }
        .loader-text {
          margin-top: 20px;
          font-size: 14px;
          font-weight: 700;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          background: linear-gradient(90deg, #f97316, #fbbf24, #f97316);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: shine 2s linear infinite;
        }
        .loader-sub {
          margin-top: 6px;
          font-size: 11px;
          font-weight: 500;
          color: #94a3b8;
          letter-spacing: 0.05em;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @keyframes pulseRing {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.06); }
        }
        @keyframes shine {
          to { background-position: 200% center; }
        }
      </style>
      <div id="initial-loader">
        <div class="loader-logo-ring">
          <div class="loader-spinner"></div>
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
            <circle cx="7" cy="17" r="2" />
            <path d="M9 17h6" />
            <circle cx="17" cy="17" r="2" />
          </svg>
        </div>
        <div class="loader-text">Car Rental Express</div>
        <div class="loader-sub">Loading Fleet & Booking...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
